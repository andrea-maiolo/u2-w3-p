<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <title>Nose & Co. BackOffice</title>

</head>

<body class="bg-dark-subtle">
    <nav class="navbar navbar-expand-lg second-bg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Nose & Co.</a>
            <button class="navbar-toggler main-bg" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Backoffice</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div id="main-container" class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <h1 id="backoffice-title" class="display-5 d-inline-block mt-5 mb-5"></h1>
                <form id="backoffice-form" class="mb-3">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nome prodotto</label>
                        <input type="text" class="form-control" id="name" aria-describedby="name"
                            placeholder="nome prodotto" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Descrizione</label>
                        <textarea class="form-control" id="description" rows="3"
                            placeholder="Inserisci una breve descrizione" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="brand" class="form-label">Brand</label>
                        <input type="text" class="form-control" id="brand" aria-describedby="brand" required
                            placeholder="brand">
                    </div>
                    <div class="mb-3">
                        <label for="imageLink" class="form-label">Immagine</label>
                        <input type="url" class="form-control" id="imageLink" aria-describedby="image"
                            placeholder="image link">
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">Prezzo €</label>
                        <input type="number" class="form-control" id="price" aria-describedby="price">
                    </div>

                    <button type="submit" class="btn main-bg"></button>
                    <button type="button" id='deleteBtn' class="btn btn-danger d-none"><i
                            class="bi bi-trash"></i></button>
                    <button type="button" id='reset-form-btn' class="btn btn-warning">Reset</button>
                </form>
            </div>
        </div>
        <!-- Alert Modal -->
        <div class="modal fade" id="alertModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Conferma Azione</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p id="alertMessage">Sei sicuro di voler cancellare questo prodotto?</p>
                    </div>
                    <div class="modal-footer">
                        <button id="confirm-button" type="button" class="btn main-bg"
                            data-bs-dismiss="modal">OK</button>
                        <button type="button" class="btn btn-info" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script src="/scripts/backOffice.js"></script>
</body>

</html>
